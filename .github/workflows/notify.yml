# Copy this file to your repo as: .github/workflows/notify.yml
name: Notify Discord

on:
  push:
    branches: [main]   # <-- REPLACE if your branch is not "main"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send commits to Discord
        env:
          # Passed as env vars (not pasted into the script) so commit messages can't inject shell code.
          COMMITS: ${{ toJson(github.event.commits) }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}   # <-- secret you create in GitHub
        run: |
          COUNT=$(echo "$COMMITS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then exit 0; fi

          LINES=$(echo "$COMMITS" | jq -r '.[] | "• " + (.message | split("\n")[0]) + " — *" + .author.name + "*"')
          CONTENT=$(printf '🆕 **%s new commit(s)** on `%s` (%s):\n%s' "$COUNT" "$REPO" "$BRANCH" "$LINES")
          CONTENT=${CONTENT:0:1900}   # Discord limit is 2000 characters

          jq -n --arg content "$CONTENT" '{content: $content, allowed_mentions: {parse: []}}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"
